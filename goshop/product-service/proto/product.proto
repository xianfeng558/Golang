// 商品服务的接口合同。message 是一块数据，等号后面的数字是字段编号，发布后不要改。
// service 里的 rpc 是可以远程调用的方法。改完要用 protoc 重新生成，不要手改 pb.go。
syntax = "proto3";
option go_package = "./;proto";
package proto;

// Product 是列表页上的一件商品，不含具体规格。
message Product {
    int32 id = 1;
    string name = 2;
    int32 startingPrice = 3;
    string mainPicture = 4;
    map<string, string> labelList = 5;
    int32 singleBuyLimit = 6;
    string token = 7;
    bool isEnable = 8;
    int32 productType = 9;
}

// PageReq 的 length 是每页条数，pageIndex 从 1 开始。
message PageReq {
    int32 length = 1;
    int32 pageIndex = 2;
}

message PageResp {
    repeated Product product = 1;
    int64 total = 2;
    int64 rows = 3;
}

service Page {
    rpc Page (PageReq) returns (PageResp) {}
}

// ProductDetail 是详情页。detail 是图文，pictureList 是用逗号拼起来的图片地址。
message ProductDetail {
    int32 id = 1;
    string name = 2;
    int32 productType = 3;
    int32 categoryId = 4;
    float startingPrice = 5;
    int32 totalStock = 6;
    string mainPicture = 7;
    float remoteAreaPostage = 8;
    int32 singleBuyLimit = 9;
    bool isEnable = 10;
    string remark = 11;
    int32 createUser = 12;
    string createTime = 13;
    int32 updateUser = 14;
    string updateTime = 15;
    bool IsDeleted = 16;
    string detail = 17;
    string pictureList = 18;
}

message ProductDetailReq {
    int32 id = 1;
}

message ProductDetailResp {
    repeated ProductDetail productDetail = 1;
}

service ShowProductDetail {
    rpc ShowProductDetail (ProductDetailReq) returns (ProductDetailResp) {}
}

// ProductSku 是可售规格。库存和售价记在这一层。
message ProductSku {
    int32 skuId = 1;
    string name = 2;
    string attributeSymbolList = 3;
    float sellPrice = 4;
    int32 stock = 5;
}

message ProductSkuReq {
    int32 productId = 1;
}

message ProductSkuResp {
    repeated ProductSku productSku = 1;
}

service ShowProductSku {
    rpc ShowProductSku (ProductSkuReq) returns (ProductSkuResp) {}
}

// ShowDetailSku 复用 ProductDetailReq。这里的 id 表示规格 ID，加购前用它查库存。
service ShowDetailSku {
    rpc ShowDetailSku (ProductDetailReq) returns (ProductSkuResp) {}
}

message UpdateSkuReq {
    ProductSku productSku = 1;
}

message UpdateSkuResp {
    bool isSuccess = 1;
}

service UpdateSku {
    rpc UpdateSku (UpdateSkuReq) returns (UpdateSkuResp) {}
}
