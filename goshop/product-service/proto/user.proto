// 商品服务里复制的一份登录合同，字段和 user-service 的 user.proto 相同。
// 商品进程本身不提供登录，这份文件只给需要用户数据结构的调用方对照。
syntax = "proto3";
option go_package = "./;proto";
package proto;

message User {
    string avatar = 1;
    int32 clientId = 2;
    int32 employeeId = 3;
    string nickname = 4;
    string phone = 5;
    string sessionId = 6;
    string token = 7;
    string tokenExpireTime = 8;
    string unionId = 9;
    int32 id = 10;
}

message LoginRequest {
    int32 clientId = 1;
    string phone = 2;
    int32 systemId = 3;
    string verificationCode = 4;
}

message LoginResp {
    string token = 1;
    User user = 2;
}

service Login {
    rpc Login (LoginRequest) returns (LoginResp) {}
}
