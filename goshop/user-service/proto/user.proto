// 用户服务的接口合同。Login 负责登录，GetUserToken 让别的服务检查这个人登录了没有。
// 等号后面的数字是字段编号，发布后不要改。改完要用 protoc 重新生成，不要手改 pb.go。
syntax = "proto3";
option go_package = "./;proto";
package proto;

// User 是登录成功后返回的用户资料。token 不是密码，是这次登录发的令牌。
message User {
    string avatar = 1;
    int32 clientId = 2;
    int32 employeeId = 3;
    string nickname = 4;
    string phone = 5;
    string sessionId = 6;
    string token = 7;
    string tokenExpireTime = 8;
    string unionId = 9;
    int32 id = 10;
}

// LoginRequest 的三个条件必须同时满足：clientId=0、systemId=0、verificationCode=6666。
message LoginRequest {
    int32 clientId = 1;
    string phone = 2;
    int32 systemId = 3;
    string verificationCode = 4;
}

message LoginResp {
    string token = 1;
    User user = 2;
}

service Login {
    rpc Login (LoginRequest) returns (LoginResp) {}
}

// TokenReq 的 uuid 是购物车和订单请求头里的用户 ID。
message TokenReq {
    string uuid = 1;
}

message TokenResp {
    string token = 1;
    bool isLogin = 2;
}

service GetUserToken {
    rpc GetUserToken (TokenReq) returns (TokenResp) {}
}
